    <text x="807" y="139" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="8.5" fill="#72A2D4">090°</text>
    <text x="706" y="227" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="8.5" fill="#72A2D4">180°</text>
    <text x="604" y="139" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="8.5" fill="#72A2D4">270°</text>

    <!-- Isometric Wireframe Cube + Cyan Core -->
    <g stroke="#ECF5FF" stroke-width="1.3" fill="none" stroke-linejoin="round">
      <polygon points="706,96 742,116 742,156 706,176 670,156 670,116"/>
      <polyline points="670,116 706,136 742,116"/>
      <line x1="706" y1="136" x2="706" y2="176"/>
    </g>
    <g stroke="#38BDF8" stroke-width="1.1" fill="#38BDF8" fill-opacity="0.16">
      <polygon points="706,114 724,124 724,146 706,156 688,146 688,124"/>
    </g>
    <circle cx="706" cy="136" r="3.5" fill="#38BDF8"/>
    <text x="588" y="54" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="9" fill="#72A2D4">FIG 1.0 · ISO CORE</text>
  </g>

  <!-- Corner Registration Marks -->
  <g stroke="#28558A" stroke-width="0.9" fill="none"><circle cx="22" cy="22" r="3"/><line x1="16" y1="22" x2="28" y2="22"/><line x1="22" y1="16" x2="22" y2="28"/></g>
  <g stroke="#28558A" stroke-width="0.9" fill="none"><circle cx="824" cy="22" r="3"/><line x1="818" y1="22" x2="830" y2="22"/><line x1="824" y1="16" x2="824" y2="28"/></g>
  <g stroke="#28558A" stroke-width="0.9" fill="none"><circle cx="824" cy="220" r="3"/><line x1="818" y1="220" x2="830" y2="220"/><line x1="824" y1="214" x2="824" y2="226"/></g>

  <!-- Bottom 4-Column CAD Title Block -->
  <text x="26" y="251" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="9" fill="#72A2D4">AUTHOR // HANDLE</text>
  <text x="26" y="274" font-family='"Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", Arial, sans-serif' font-size="16" font-weight="800" fill="#ECF5FF">NeverGiveUp</text>

  <line x1="224.5" y1="232.5" x2="224.5" y2="289.5" stroke="#28558A" stroke-width="1"/>
  <text x="240" y="251" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="9" fill="#72A2D4">FLAGSHIP SYSTEMS</text>
  <text x="240" y="274" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="16" font-weight="700" fill="#38BDF8">04 <tspan font-size="11.5" font-weight="600" fill="#B3D4F7">VERIFIED</tspan></text>

  <line x1="432.5" y1="232.5" x2="432.5" y2="289.5" stroke="#28558A" stroke-width="1"/>
  <text x="448" y="251" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="9" fill="#72A2D4">PUBLIC REPOSITORIES</text>
  <text x="448" y="274" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="16" font-weight="700" fill="#ECF5FF">12 <tspan font-size="11.5" font-weight="600" fill="#B3D4F7">OSS REPOS</tspan></text>

  <line x1="636.5" y1="232.5" x2="636.5" y2="289.5" stroke="#28558A" stroke-width="1"/>
  <text x="652" y="251" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="9" fill="#72A2D4">SYNCED AI AGENTS</text>
  <text x="652" y="274" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="16" font-weight="700" fill="#2DD4BF">20+ <tspan font-size="11.5" font-weight="600" fill="#B3D4F7">MCP · SKILL</tspan></text>
