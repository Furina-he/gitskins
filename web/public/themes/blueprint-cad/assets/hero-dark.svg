<svg xmlns="http://www.w3.org/2000/svg" width="846" height="300" viewBox="0 0 846 300" role="img" aria-label="Furina-he — Architectural Blueprint CAD Profile">
  <title>Furina-he — Architectural Blueprint CAD Profile</title>
  <defs>
    <pattern id="gmin-hero-dark" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#112D52" stroke-width="0.6"/>
    </pattern>
    <pattern id="gmaj-hero-dark" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="url(#gmin-hero-dark)"/>
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1B4272" stroke-width="0.9"/>
    </pattern>
  </defs>
  <style>
    @keyframes cadSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .cad-orbit {
      transform-origin: 706px 136px;
      animation: cadSweep 24s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .cad-orbit { animation: none !important; }
    }
  </style>

  <!-- Drafting Sheet Surface + Coordinate Grid -->
  <rect x="0.5" y="0.5" width="845" height="299" fill="#0A1E38"/>
  <rect x="1" y="1" width="844" height="298" fill="url(#gmaj-hero-dark)"/>

  <!-- Outer & Inner Architectural Margin Borders -->
  <rect x="0.5" y="0.5" width="845" height="299" fill="none" stroke="#5EA8F0" stroke-width="1.2"/>
  <rect x="10.5" y="10.5" width="825" height="279" fill="none" stroke="#28558A" stroke-width="0.9"/>

  <!-- Top Revision & Datum Bar -->
  <line x1="10.5" y1="36.5" x2="835.5" y2="36.5" stroke="#5EA8F0" stroke-width="1"/>
  <text x="36" y="27" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="10.5" font-weight="700" fill="#38BDF8">DWG NO. GH-FURINA-01</text>
  <text x="204" y="27" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="10" fill="#72A2D4">REV 2026.11  ·  SCALE 1:1  ·  PROJ: ORTHO</text>
  <rect x="670" y="19.5" width="6" height="6" fill="#2DD4BF"/>
  <text x="682" y="26.5" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="10" font-weight="600" fill="#ECF5FF">cloudlink.blessc.com</text>

  <!-- Zone Ruler Ticks Along Top Margin -->
  <text x="150" y="9" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="7.5" fill="#72A2D4">A</text>
  <text x="360" y="9" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="7.5" fill="#72A2D4">B</text>
  <text x="570" y="9" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="7.5" fill="#72A2D4">C</text>
  <text x="740" y="9" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="7.5" fill="#72A2D4">D</text>

