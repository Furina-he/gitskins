  <polygon points="28,191 542,191 552,201 552,220 28,220" fill="#0D2442" stroke="#5EA8F0" stroke-width="1"/>
  <text x="39" y="209.5" font-family='"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="11" fill="#ECF5FF"><tspan fill="#38BDF8" font-weight="700">NOTE 01:</tspan> building safe agent infra, resident AI pets &amp; 3D labs</text>

