  <g transform="translate(0, 0)">
    <circle cx="706" cy="136" r="74" fill="none" stroke="#28558A" stroke-width="0.9"/>
    <circle cx="706" cy="136" r="56" fill="none" stroke="#28558A" stroke-width="0.8" stroke-dasharray="3 3"/>
    <circle cx="706" cy="136" r="34" fill="none" stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.7"/>
    <line x1="620" y1="136" x2="792" y2="136" stroke="#28558A" stroke-width="0.7" stroke-dasharray="4 3"/>
    <line x1="706" y1="52" x2="706" y2="220" stroke="#28558A" stroke-width="0.7" stroke-dasharray="4 3"/>

