  <text x="30" y="136" font-family='"Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", Arial, sans-serif' font-size="52" font-weight="800" letter-spacing="3.5" fill="none" stroke="#28558A" stroke-width="0.9">FURINA-HE</text>
  <text x="27" y="133" font-family='"Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", Arial, sans-serif' font-size="52" font-weight="800" letter-spacing="3.5" fill="#ECF5FF">FURINA-HE</text>

