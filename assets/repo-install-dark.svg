<svg xmlns="http://www.w3.org/2000/svg" width="846" height="72" viewBox="0 0 846 72" role="img" aria-label="Quick Install: npx gitskins init --mode repo --theme swiss-bauhaus-pixel --badge">
  <title>Quick Install Command</title>
  <style>
    @keyframes cur_ri-swiss-bauhaus-pixel-dark { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.12; } }
