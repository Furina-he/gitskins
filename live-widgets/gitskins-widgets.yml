name: Update GitSkins Live Widgets

on:
  schedule:
    # Refresh every 6 hours (adjust to "0 0 * * *" for daily updates)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live-widgets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate theme-matched live SVGs (zero pip deps)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_live_widgets.py \
            --username "${{ github.repository_owner }}" \
            --theme "swiss-bauhaus-pixel" \
            --widgets "github-stats:2,coding-rhythm:2,live-weather:1,rss-feed:3" \
            --city "Shanghai" \
            --unit "C" \
            --tz-offset "8" \
            --rss-url "" \
            --out-dir "assets"

      - name: Commit & push updated SVGs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(gitskins): refresh live profile widgets"
            git push
          fi
