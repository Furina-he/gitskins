  <text x="48" y="33.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="9.5" font-weight="700" letter-spacing="0.8" fill="#E5B84B">U1 · GUARDRAIL</text>
  <text x="381" y="33.5" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="9" font-weight="600" fill="#B6D4C5">cloudlink.blessc.com</text>
  <line x1="26" y1="43.5" x2="391" y2="43.5" stroke="#1E4A38" stroke-width="0.9"/>

  <!-- Package Title, Silkscreen Footprint Stamp & 2-Line Description -->
  <text x="30" y="76" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="-0.3" fill="#F2F7F4">CloudLink</text>
