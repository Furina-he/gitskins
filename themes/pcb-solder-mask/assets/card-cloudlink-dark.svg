  <g fill="none" stroke="#193D2E" stroke-opacity="0.55" stroke-width="1.1" aria-hidden="true">
    <path d="M 326 146 L 348 124 H 386"/>
    <path d="M 342 146 L 358 130 H 386"/>
  </g>

  <!-- 4 Corner Gold Via Pads -->
  <g aria-hidden="true"><circle cx="24" cy="18" r="3.0" fill="#E5B84B"/><circle cx="24" cy="18" r="1.35" fill="#102B20"/></g>
  <g aria-hidden="true"><circle cx="393" cy="18" r="3.0" fill="#E5B84B"/><circle cx="393" cy="18" r="1.35" fill="#102B20"/></g>
  <g aria-hidden="true"><circle cx="24" cy="178" r="3.0" fill="#E5B84B"/><circle cx="24" cy="178" r="1.35" fill="#102B20"/></g>
  <g aria-hidden="true"><circle cx="393" cy="178" r="3.0" fill="#E5B84B"/><circle cx="393" cy="178" r="1.35" fill="#102B20"/></g>

