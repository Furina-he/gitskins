  <text x="340" y="70.8" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="8.5" font-weight="700" fill="#B6D4C5">SOIC-12 · v0.6</text>

  <text x="30" y="104" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.2" fill="#B6D4C5">Local-first AI ops cockpit with zero-secret</text>
  <text x="30" y="124" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.2" fill="#B6D4C5">deterministic execution guardrails.</text>

  <!-- Bottom Test-Point Spec Bar -->
  <line x1="26" y1="146.5" x2="391" y2="146.5" stroke="#1E4A38" stroke-width="0.9" stroke-dasharray="3 3"/>
  <circle cx="34" cy="164.5" r="3.5" fill="#E5B84B"/>
  <circle cx="34" cy="164.5" r="1.5" fill="#102B20"/>
  <text x="43" y="167.8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="8.8" font-weight="700" fill="#E5B84B">TP1</text>
  <text x="66" y="167.8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="9.8" fill="#B6D4C5">Rust · Tauri v2 · TypeScript</text>
  <text x="381" y="167.8" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="9.5" font-weight="700" fill="#E5B84B">PROBE ↗</text>
