<svg xmlns="http://www.w3.org/2000/svg" width="417" height="196" viewBox="0 0 417 196" role="img" aria-label="CloudLink">
  <title>CloudLink — Classic Desktop App Window</title>
  <!-- Hard 3px Window Shadow + Mini Application Window -->
  <rect x="3" y="3" width="413" height="192" fill="#111111" shape-rendering="crispEdges"/>
  <rect x="0.5" y="0.5" width="413" height="192" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" shape-rendering="crispEdges"/>

  <!-- 6-Line Pin-Stripe Titlebar -->
  <rect x="1" y="1" width="412" height="25" fill="#E6E5DF" shape-rendering="crispEdges"/>
  <path fill="#111111" opacity="0.65" shape-rendering="crispEdges" d="M6 8h402v1h-402zM6 10h402v1h-402zM6 12h402v1h-402zM6 14h402v1h-402zM6 16h402v1h-402zM6 18h402v1h-402z"/>
  <line x1="1" y1="26.5" x2="413" y2="26.5" stroke="#111111" stroke-width="1.2"/>

  <!-- Top-Left Square Close Box -->
  <rect x="8" y="5" width="17" height="17" fill="#E6E5DF" shape-rendering="crispEdges"/>
  <rect x="11" y="8" width="11" height="11" fill="#FFFFFF" stroke="#111111" stroke-width="1.1" shape-rendering="crispEdges"/>

  <!-- Top-Right App Accent Chip -->
  <rect x="388" y="5" width="17" height="17" fill="#E6E5DF" shape-rendering="crispEdges"/>
  <rect x="391" y="8" width="11" height="11" fill="#2455C8" stroke="#111111" stroke-width="1.1" shape-rendering="crispEdges"/>

  <!-- Centered Masked Title -->
  <rect x="129" y="4" width="155" height="19" fill="#E6E5DF" shape-rendering="crispEdges"/>
  <text x="207" y="17.5" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#111111">01 · CloudLink.app</text>

  <!-- Left Content Area -->
  <rect x="18" y="42" width="7" height="7" fill="#2455C8" shape-rendering="crispEdges"/>
  <text x="31" y="49" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="9.5" font-weight="700" fill="#3B3B3F">GUARDRAIL · DAEMON</text>
  <text x="18" y="78" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="20" font-weight="800" fill="#111111">CloudLink</text>
  <text x="18" y="104" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.2" fill="#3B3B3F">Zero-credential AI ops bridge with</text>
  <text x="18" y="123" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.2" fill="#3B3B3F">deterministic execution guardrails.</text>
  <text x="18" y="149" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="9.5" font-weight="700" fill="#3B3B3F">/Applications/CloudLink.app</text>

  <!-- Right 12x12 Pixel App Icon Well -->
  <rect x="316" y="44" width="82" height="82" fill="#E6E5DF" stroke="#111111" stroke-width="1.1" shape-rendering="crispEdges"/>
  <g shape-rendering="crispEdges"><path fill="#111111" d="M327 55h50v5h-50zM327 60h5v5h-5zM372 60h10v5h-10zM327 65h5v5h-5zM377 65h10v5h-10zM327 70h5v5h-5zM382 70h5v5h-5zM327 75h5v5h-5zM382 75h5v5h-5zM327 80h5v5h-5zM382 80h5v5h-5zM327 85h5v5h-5zM382 85h5v5h-5zM327 90h5v5h-5zM382 90h5v5h-5zM327 95h5v5h-5zM382 95h5v5h-5zM327 100h5v5h-5zM382 100h5v5h-5zM327 105h5v5h-5zM382 105h5v5h-5zM327 110h60v5h-60z"/><path fill="#2455C8" d="M332 60h5v5h-5zM347 60h15v5h-15zM332 65h5v5h-5zM347 65h15v5h-15zM372 65h5v5h-5zM332 70h5v5h-5zM372 70h10v5h-10zM332 75h50v5h-50zM332 80h50v5h-50zM332 85h5v5h-5zM377 85h5v5h-5zM332 90h5v5h-5zM342 90h25v5h-25zM377 90h5v5h-5zM332 95h5v5h-5zM377 95h5v5h-5zM332 100h5v5h-5zM342 100h30v5h-30zM377 100h5v5h-5zM332 105h5v5h-5zM377 105h5v5h-5z"/><path fill="#FFFFFF" d="M337 60h10v5h-10zM362 60h10v5h-10zM337 65h10v5h-10zM362 65h10v5h-10zM337 70h35v5h-35zM337 85h40v5h-40zM337 90h5v5h-5zM367 90h10v5h-10zM337 95h40v5h-40zM337 100h5v5h-5zM372 100h5v5h-5zM337 105h40v5h-40z"/></g>
  <text x="357" y="144" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="8.8" font-weight="700" fill="#3B3B3F">SYSTEM DISK</text>

  <!-- Status Footer Bar + Bottom-Right Diagonal Resize Grip Lines -->
  <line x1="1" y1="164.5" x2="413" y2="164.5" stroke="#111111" stroke-width="1.1"/>
  <rect x="1" y="165" width="412" height="27" fill="#E6E5DF" shape-rendering="crispEdges"/>
  <text x="16" y="182" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="9.8" font-weight="700" fill="#3B3B3F">STACK: Rust · Tauri · TypeScript</text>

  <line x1="389.5" y1="165" x2="389.5" y2="192" stroke="#111111" stroke-width="1"/>
  <line x1="395" y1="189" x2="409" y2="175" stroke="#111111" stroke-width="1.2"/>
  <line x1="400" y1="189" x2="409" y2="180" stroke="#111111" stroke-width="1.2"/>
  <line x1="405" y1="189" x2="409" y2="185" stroke="#111111" stroke-width="1.2"/>
</svg>