<svg xmlns="http://www.w3.org/2000/svg" width="417" height="196" viewBox="0 0 417 196" role="img" aria-label="GitSkins — Print 03">
  <title>GitSkins — Risograph Art Print 03</title>
  <defs>
    <pattern id="ht-card-gitskins-light" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.8" cy="1.8" r="1.25" fill="#0E9472" fill-opacity="0.28"/><circle cx="5.2" cy="5.2" r="1.25" fill="#0E9472" fill-opacity="0.28"/><circle cx="3.5" cy="7.0" r="0.94" fill="#0E9472" fill-opacity="0.15"/></pattern>
  </defs>

  <!-- Misregistered 3.5px colored ink shadow layer -->
  <rect x="4" y="4" width="412" height="191" fill="#0E9472" fill-opacity="0.85"/>

  <!-- Main crisp art-print card -->
  <rect x="0.5" y="0.5" width="411" height="190" fill="#FDFBF5" stroke="#17203B" stroke-width="1.4"/>

  <!-- Halftone header block -->
  <rect x="1.2" y="1.2" width="409.6" height="44" fill="#EFE8D8"/>
  <rect x="1.2" y="1.2" width="409.6" height="44" fill="url(#ht-card-gitskins-light)"/>
  <line x1="0.5" y1="45.2" x2="411.5" y2="45.2" stroke="#17203B" stroke-width="1.2"/>

  <!-- Bold print number stamp (01..04) with 2px offset ink shadow -->
  <rect x="14.5" y="11" width="38" height="27" fill="#0E9472"/>
  <rect x="12" y="8.5" width="38" height="27" fill="#17203B" stroke="#17203B" stroke-width="1"/>
  <text x="31" y="26.5" text-anchor="middle" font-family="'Space Grotesk','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#FDFBF5">03</text>

  <!-- Crisp knockout category plate tag -->
  <rect x="60" y="12.5" width="95" height="20" fill="#FDFBF5" stroke="#17203B" stroke-width="1"/>
  <circle cx="70.5" cy="22.5" r="3.2" fill="#0E9472"/>
  <text x="80" y="25.8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="9.0" font-weight="700" letter-spacing="0.8" fill="#17203B">PRINT KIT</text>

  <!-- Header registration crosshair -->
  <g aria-hidden="true"><circle cx="394.1" cy="23.6" r="4.0" fill="none" stroke="#0E9472" stroke-opacity="0.55" stroke-width="0.9"/><circle cx="393.0" cy="22.5" r="4.0" fill="none" stroke="#17203B" stroke-width="1"/><line x1="386.4" y1="22.5" x2="399.6" y2="22.5" stroke="#17203B" stroke-width="1"/><line x1="393.0" y1="15.9" x2="393.0" y2="29.1" stroke="#17203B" stroke-width="1"/><circle cx="393.0" cy="22.5" r="1.1" fill="#17203B"/></g>

  <!-- Misregistered duotone project title -->
  <text x="18" y="85.8" font-family="'Space Grotesk','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="900" fill="#0E9472" fill-opacity="0.50">GitSkins</text>
  <text x="16" y="84" font-family="'Space Grotesk','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="900" fill="#17203B">GitSkins</text>

  <!-- Crisp description lines -->
  <text x="16" y="112" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.2" fill="#3E4A6B">Modular Light &amp; Dark GitHub Profile &amp; Repo</text>
  <text x="16" y="131" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.2" fill="#3E4A6B">SVG themes with Bento &amp; Live widgets.</text>

  <!-- Ink-density spec footer -->
  <line x1="16" y1="152" x2="395" y2="152" stroke="#D7CEBC" stroke-width="1"/>
  <text x="16" y="175" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="9.6" font-weight="600" fill="#3E4A6B">TypeScript · Python · SVG</text>
  <rect x="274" y="167" width="10" height="9" fill="#0E9472" fill-opacity="1.00" stroke="#17203B" stroke-opacity="0.35" stroke-width="0.6"/><rect x="287" y="167" width="10" height="9" fill="#0E9472" fill-opacity="0.72" stroke="#17203B" stroke-opacity="0.35" stroke-width="0.6"/><rect x="300" y="167" width="10" height="9" fill="#0E9472" fill-opacity="0.45" stroke="#17203B" stroke-opacity="0.35" stroke-width="0.6"/><rect x="313" y="167" width="10" height="9" fill="#0E9472" fill-opacity="0.22" stroke="#17203B" stroke-opacity="0.35" stroke-width="0.6"/>
  <text x="395" y="174.5" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="9.8" font-weight="700" fill="#17203B">OPEN ↗</text>
  <rect x="353" y="178" width="42" height="2.6" fill="#0E9472"/>
</svg>